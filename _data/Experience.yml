subject: Experiences
listing-order: 3
icon: "/assets/img/briefcase.svg"
contents:
  - title: (주)워트인텔리전스
    role1: 신규 서비스 데이터 TF 리드 · 데이터 총괄 (2026.01 ~ 현재)
    description1:
      - "화학/바이오 특화 특허 검색 서비스의 데이터 TF 리드 — 데이터 생성부터 서빙까지 전 구간 담당 (서비스 개발은 별도 Product팀), 착수 9개월 만에 2026.09 베타 오픈"
      - sub: "어떤 데이터를 어떤 형태와 품질로 제공할 수 있는지 정의해 Product팀에 공유, 서비스 기획에 활용"
      - "데이터 아키텍처 설계 및 파이프라인 구축"
      - sub: "화합물 엔티티 모델(이름·구조 분리), 특허-화합물 관계, PubChem 전량 로컬 조인, Delta Lake 적재, Elasticsearch·ScyllaDB 서빙 분담, 적재 전 품질 검증, 증분 처리"
      - sub: "화합물 1.56억 건, 특허-화합물 관계 18.5억 건 파이프라인 구축 및 15개국 전량 처리"
      - "LLM 기반 특허-화합물 추출 파이프라인 구축"
      - sub: "기존 사전 매칭 방식(Aho-Corasick)의 정밀도가 7.5%에 그치는 것을 정답셋으로 확인하고 폐기, LLM 추출로 전환해 정확도 94.4% 확보"
      - sub: "프롬프트 설계, 출력 형식(JSON) 정의, 후처리 판정 로직 구성"
      - sub: "추출 품질 기준 수립: 정답셋으로 프롬프트 후보를 비교해 채택안 선정, 후처리 규칙은 걸러야 할 사례와 살려야 할 사례를 함께 테스트한 뒤 반영"
      - sub: "화합물 이름 정규화 규칙 설계: 같은 물질이 여러 표기로 흩어지는 문제를 구조 기준으로 통합, 이성질체(R/S)는 자동 병합 금지"
      - "외부 화학 특화 LLM 검증 및 협업사 창구"
      - sub: "협업사가 제시한 성능 점수를 자체 환경에서 재현하는 비교 실험 설계, 결과를 정리해 C레벨 보고 {::nomarkdown}<br>{:/}"
    role2: 검색·벡터 인프라
    description2:
      - "특허 벡터 검색 파이프라인 설계·구축 — 1억 561만 건, 무중단(Blue-Green) 갱신"
      - sub: "15개국 특허 원문(Elasticsearch)에서 LLM으로 키워드·요약을 만들고 Aurora에 모았다가 Qdrant에 적재하는 구조"
      - sub: "특허 1억 건 대상 LLM 키워드·요약 생성 배치 운영, GPU 공유 제약에 맞춘 스케줄링"
      - sub: "중간 저장소를 Kudu/Impala에서 Aurora로 무중단 전환, 500만 건 처리 시 메모리 부족은 스트리밍 방식으로 해소"
      - "Qdrant 5노드 클러스터(노드당 251GB) 설계·운영"
      - sub: "Prometheus·Grafana 모니터링과 Slack 알림 구축"
      - sub: "클러스터 전면 장애 원인 규명(인덱스 설정 누락으로 메모리 초과) 및 영구 조치, 검색 응답 5.4ms → 2.2ms {::nomarkdown}<br>{:/}"
    role3: 데이터 플랫폼·거버넌스
    description3:
      - "Data Atlas 초기 설계 참여"
      - sub: "특허 기준 데이터(Master Table) 개념과 데이터 출처 추적 관리 방향(OpenMetadata) 정의"
      - sub: "이후 신규 서비스 데이터 TF와 병행해 기존 파이프라인 로직과 데이터 품질 분석"
      - "기존 파이프라인 역추적 및 데이터 품질 분석"
      - sub: "문서가 없는 Java·Airflow·Databricks 혼재 파이프라인을 역추적해 데이터 제품 7종의 가공 로직과 필드 출처 확정"
      - sub: "결함 규명(특정 국가 분류코드 결측 등), 타 팀 조사와 수치가 일치해 교차 검증"
      - "Databricks Medallion(Bronze→Silver→Gold) 구조에 화합물 파이프라인 적재 구현"
    date: 2025.07 -

  - title: (주)광개토연구소 - 선임연구원
    role1: 과제 제안 및 PM
    description1:
      - "특허-논문-Web 통합 기술전략 시스템 개발 (2022.10 ~ 2024.12, 구매조건부신제품개발사업, 삼성전자)"
      - sub: "논문·GitHub 데이터 수집·관리 프로세스 기획 및 총괄. Semantic Scholar·OpenAlex 등을 통합해 학술논문 2억 건+ DB 구축 및 특허 연계, 저널·학회·기관별 지표 산출, 월 단위 자동 갱신"
      - "국가 R&D 과제 DB 구축 및 특허 연계 (2021.04 ~ 2021.10, AI바우처, 특허법인수)"
      - sub: "아이디어 제안 및 프로젝트 총괄. RFP 일 단위 수집, 유사도·최신성 가중치 기반 기업·발명자·기술분야별 RFP 추천 알고리즘 구현, 특허 엔티티 연계"
      - "경제 뉴스 일 단위 수집 및 특허 연계, 기업·기술 연관 뉴스 서비스 데이터 구축 {::nomarkdown}<br>{:/}"
    role2: Data Engineering
    description2:
      - "MariaDB(Aria) 기반 대용량 ERD 설계 및 Bulk Insert 최적화, Airflow ETL 파이프라인 구축"
      - "Python·Spark 전처리 및 Feature 생성, Elasticsearch·MongoDB로 서비스 데이터 제공"
      - "KR/US 권리자 경쟁기업 DB, 특허 거절 데이터 DB 구축 {::nomarkdown}<br>{:/}"
    role3: Machine Learning / AI Modeling
    description3:
      - "발명자 국적 추정 모델 기획 및 총괄 (2024.06 ~ 2024.10)"
      - sub: "Nana Dataset과 발명자 영문명으로 GPT-2 시퀀스 분류 fine-tuning, FastAPI 서빙으로 특허 발명자·논문 저자 국적 추정에 활용"
      - "키워드 추천 모델: 미래 동시출현 키워드 예측, Neural Matrix Factorization 기반 협업 필터링"
      - "기업·기술분야·발명자 유망성 평가 모델 (XGBoost·LightGBM 앙상블)"
      - "특허 소송 가능성 예측 모델 (LightGBM) {::nomarkdown}<br>{:/}"
    role4: 병역
    description4:
      - "전문연구요원 (2020.08 ~ 2023.08)"
    date: 2020.08 - 2024.12
