subject: Summary
listing-order: 1
icon: "/assets/img/globe.svg"
contents:
  - title: "서로 다른 데이터를 연계해 새로운 검색·분석 축을 만드는 일을 해왔습니다."
    intro: "박사논문의 특허-상표 연계에서 시작해 특허-외부데이터로, 지금은 특허-화합물로 이어집니다."
    description:
      - "**대규모 데이터**: 특허 벡터 1억 건+, 화합물 1.5억 건+, 특허-화합물 관계 18억 건+"
      - "**검색 인프라**: Qdrant 5노드 클러스터 설계·운영, Elasticsearch·ScyllaDB 운영"
      - "**LLM 파이프라인**: 특허 본문에서 데이터를 뽑아내는 파이프라인과 품질 기준 수립, 외부 모델 검증"
      - "**리드**: 신규 서비스 데이터 TF 리드, 제공 범위 정의부터 결과 보고까지, 외부 협업사 검증과 C레벨 보고"
      - "**일하는 방식**: 니즈에서 출발해 필요한 데이터를 정의·수집·분석하고, 직관은 가설로 두되 최종 판단은 데이터 기반 의사결정(data-driven decision)으로 내립니다"
      - tag: Qdrant,Elasticsearch,Databricks / Delta Lake,Airflow,Spark,ScyllaDB,Python,RDKit
