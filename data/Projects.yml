# featured: true 이면 전체 폭 카드. rows는 라벨-내용 쌍, flow는 데이터 흐름 노드 순서
# methods: 이 프로젝트에서 쓴 방법론(강조 태그), tags: 사용 기술
note: "문제 · 판단 · 결과"

items:
  - title: "특허-화합물 데이터 구축과 LLM 추출 전환"
    meta: "2026 · 워트인텔리전스"
    featured: true
    rows:
      - label: "문제"
        text: "화학/바이오 특허 검색 서비스에 필요한 특허-화합물 관계를 15개국 특허 전량에서 확보해야 함"
      - label: "판단"
        text: "사전 매칭(Aho-Corasick)의 정밀도를 정답셋으로 측정해 7.5%임을 확인하고 폐기, LLM 추출과 구조 기준 이름 정규화로 전환. 이성질체(R/S)는 자동 병합하지 않도록 규칙 설계"
      - label: "결과"
        text: "추출 정확도 94.4%, 화합물 1.56억 건, 특허-화합물 관계 18.5억 건 구축, 착수 9개월 만에 베타 오픈"
    flow: ["특허 원문", "LLM 추출", "정규화 · PubChem 조인", "적재 전 검증", "Delta Lake", "ES · ScyllaDB"]
    methods: [Golden-set Evaluation, Structured Output Design, Entity Resolution, Pre-load Data Validation]
    tags: [LLM, RDKit, Databricks, Delta Lake, ScyllaDB]

  - title: "특허 1억 건 벡터 검색 인프라"
    meta: "2025 ~ · 워트인텔리전스"
    featured: true
    rows:
      - label: "문제"
        text: "15개국 특허 1억 건 이상에 대한 의미 기반 검색을 무중단으로 갱신하며 운영해야 함"
      - label: "판단"
        text: "LLM 키워드·요약 배치를 GPU 공유 제약에 맞춰 스케줄링, Blue-Green 방식 갱신, 대량 처리 메모리 부족은 스트리밍으로 해소. 전면 장애는 원인(인덱스 설정 누락으로 인한 메모리 초과)을 규명해 영구 조치"
      - label: "결과"
        text: "1억 561만 건 적재, Qdrant 5노드(노드당 251GB) 운영, 검색 응답 5.4ms에서 2.2ms로 단축"
    flow: ["Elasticsearch", "LLM 키워드·요약", "Aurora", "Qdrant"]
    methods: [LLM Batch Inference, Zero-downtime Migration]
    tags: [Qdrant, Elasticsearch, Aurora, Prometheus, Grafana]

  - title: "특허-논문-Web 통합 기술전략 시스템"
    meta: "2022.10 ~ 2024.12 · 광개토연구소 with 삼성전자"
    featured: true
    rows:
      - label: "문제"
        text: "특허와 논문·GitHub 데이터를 엮어 저널·학회·기관 단위의 기술전략 지표를 제공해야 함"
      - label: "판단"
        text: "Semantic Scholar·OpenAlex 등 복수 학술 DB를 통합하고, MariaDB(Aria) Bulk Insert 최적화와 Ray 병렬 수집으로 대용량 적재"
      - label: "결과"
        text: "학술논문 2억 건+ DB와 특허 연계, 기관별 지표 산출, Airflow 월 단위 자동 갱신"
    flow: ["학술 DB 수집", "통합·정제", "MariaDB", "Spark 지표 산출", "ES · MongoDB"]
    tags: [Spark, MariaDB, Airflow, Ray]
