items:
  - title: "특허-화합물 데이터 구축과 LLM 추출 전환"
    meta: "2026 · 워트인텔리전스"
    featured: true
    rows:
      - label: "문제"
        text: "화학/바이오 특허 검색 서비스에 필요한 특허-화합물 관계를 15개국 특허 전량에서 확보해야 함"
      - label: "판단"
        text: "사전 매칭 정밀도를 정답셋으로 측정해 7.5%임을 확인하고 폐기, LLM 추출과 구조 기준 이름 정규화로 전환"
      - label: "결과"
        text: "추출 정확도 94.4%, 화합물 1.56억 건, 관계 18.5억 건 구축, 착수 9개월 만에 베타 오픈"
    flow: ["특허 원문", "LLM 추출", "정규화 · PubChem 조인", "Delta Lake", "ES · ScyllaDB"]
    tags: [LLM, RDKit, Databricks, Delta Lake, ScyllaDB]

