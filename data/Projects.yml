      - label: "판단"
        text: "Blue-Green 갱신, Qdrant 5노드 클러스터, 장애 원인(인덱스 설정 누락)을 규명해 영구 조치"
      - label: "결과"
        text: "1억 561만 건 적재, 검색 응답 5.4ms에서 2.2ms로 단축"
