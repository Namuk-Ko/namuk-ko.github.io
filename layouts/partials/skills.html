{{ with hugo.Data.Skills }}
<section id="skills">
  <div class="sec-head"><span class="idx">04</span><h2>Skills</h2></div>
  {{ with .stack }}
  <h3 class="sub-head">Tech Stack</h3>
  <div class="skills">
    {{ range . }}
    <div class="skill">
      <h3>{{ .name }}</h3>
      <div class="tags">{{ range .items }}<span class="tag">{{ . }}</span>{{ end }}</div>
    </div>
    {{ end }}
  </div>
  {{ end }}
  {{ with .practices }}
  <h3 class="sub-head">Practices</h3>
  <ul class="practices">
    {{ range . }}
    <li><span class="pr-name">{{ .name }}</span><span class="pr-evidence">{{ .evidence }}</span></li>
    {{ end }}
  </ul>
  {{ end }}
</section>
{{ end }}
