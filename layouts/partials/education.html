{{ with hugo.Data.Education }}
<section id="education">
  <div class="sec-head"><span class="idx">05</span><h2>Education</h2></div>
  <div class="edu">
    {{ range .items }}
    <div class="edu-item">
      <div class="date">{{ .date }}</div>
      <div>
        <h3>{{ .degree }}</h3>
        {{ with .thesis }}<p>{{ . }}</p>{{ end }}
        {{ with .thesis_en }}<p class="en">{{ . }}</p>{{ end }}
      </div>
    </div>
    {{ end }}
  </div>
</section>
{{ end }}
